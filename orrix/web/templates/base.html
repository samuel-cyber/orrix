<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>{% block title %}Orrix{% endblock %}</title>
  <!-- Theme is set before first paint by this external file. No inline
       script: script-src stays strict. -->
  <script src="/static/theme.js"></script>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.20/index.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5.0.20/index.css">
  <link rel="stylesheet" href="/static/app.css">
  {% block head %}{% endblock %}
</head>
<body
  data-ag-grid-license="{{ ag_grid_license_key }}"
  data-csrf-token="{{ csrf_token }}"
  data-active="{{ active }}">
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <a href="/overview" class="wordmark">Orrix</a>
        <span class="pill-sandbox" title="Orrix never touches real money">SANDBOX</span>
      </div>
      <nav class="sidebar-nav" aria-label="Primary">
        <a href="/overview" class="nav-item {% if active == '/overview' %}current{% endif %}">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7">
              <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
              <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
              <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
              <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
            </svg>
          </span>
          Overview
        </a>
        <a href="/cases" class="nav-item {% if active.startswith('/cases') %}current{% endif %}">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7">
              <path d="M4 6h16M4 12h16M4 18h10"></path>
            </svg>
          </span>
          Cases
        </a>
        <a href="/orders" class="nav-item {% if active.startswith('/orders') %}current{% endif %}">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7">
              <path d="M3 7l9-4 9 4v10l-9 4-9-4z"></path>
              <path d="M3 7l9 4 9-4M12 11v10"></path>
            </svg>
          </span>
          Orders
        </a>
        <a href="/lab" class="nav-item {% if active.startswith('/lab') %}current{% endif %}">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7">
              <path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4A2 2 0 0 0 19 18l-5-9V3"></path>
              <path d="M7 15h10"></path>
            </svg>
          </span>
          Attack Lab
        </a>
        <a href="/audit" class="nav-item {% if active.startswith('/audit') %}current{% endif %}">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7">
              <path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"></path>
              <path d="M9.5 12l1.8 1.8 3.4-3.6"></path>
            </svg>
          </span>
          Audit
        </a>
        <a href="/evaluation" class="nav-item {% if active.startswith('/evaluation') %}current{% endif %}">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7">
              <path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path>
            </svg>
          </span>
          Evaluation
        </a>
      </nav>
      <div class="sidebar-foot">
        <form method="post" action="/logout" class="inline-form">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <button type="submit" class="btn btn-quiet">Sign out</button>
        </form>
      </div>
    </aside>

    <div class="shell-main">
      <header class="topbar">
        <div class="topbar-left">
          <button type="button" class="icon-btn" data-sidebar-toggle aria-expanded="true"
                  aria-controls="sidebar" title="Toggle sidebar">
            <span class="visually-hidden">Toggle sidebar</span>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
              <path d="M3 5h18M3 12h18M3 19h18"></path>
            </svg>
          </button>
          <span class="poll-indicator" title="From the poller's last completed pass; no live call">
            <span class="poll-dot{% if poll and poll.seconds_ago is none %} stale{% endif %}" data-poll-dot></span>
            <span data-poll-label
                  data-poll-seconds="{% if poll and poll.seconds_ago is not none %}{{ poll.seconds_ago }}{% else %}-1{% endif %}"
                  data-poll-enabled="{% if poll and poll.enabled %}1{% else %}0{% endif %}">{{ poll.label if poll else 'not yet' }}</span>
          </span>
        </div>
        <div class="topbar-right">
          <button type="button" class="btn btn-quiet palette-trigger" data-palette-open
                  title="Command palette (Ctrl/Cmd+K)">
            <span>Search</span>
            <kbd class="kbd">Ctrl K</kbd>
          </button>
          <button type="button" class="icon-btn" data-theme-toggle aria-pressed="false"
                  title="Switch to light theme">
            <span class="visually-hidden">Toggle theme</span>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
              <path d="M12 3v2M12 19v2M5 12H3M21 12h-2M6 6l1.5 1.5M16.5 16.5L18 18M18 6l-1.5 1.5M7.5 16.5L6 18"></path>
              <circle cx="12" cy="12" r="4"></circle>
            </svg>
          </button>
        </div>
      </header>

      <main class="page {{ page_class | default('', true) }}">
        {% block content %}{% endblock %}
      </main>

      <footer class="footer">
        <span>Sandbox only &middot; no real money moves</span>
      </footer>
    </div>
  </div>

  <div class="palette-backdrop" id="command-palette" role="dialog" aria-modal="true"
       aria-label="Command palette" hidden>
    <div class="command-palette">
      <input type="text" class="palette-input" aria-label="Search commands"
             placeholder="Jump to a page, case or action&hellip;" autocomplete="off">
      <div class="palette-list" role="listbox"></div>
    </div>
  </div>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <script src="/static/shell.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
