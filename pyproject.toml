[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orrix"
version = "0.0.1"
description = "Sandbox-only PayPal dispute response agent."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Ojo Samuel Oluwasemilore" }]
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "requests",
    "python-dotenv",
    "jinja2",
    "python-multipart",
    # Evidence pack PDFs. Pure Python, pinned: the pack's content hash is a
    # promise of byte-identical output for the same facts, and a renderer
    # that drifts between versions would break that.
    "fpdf2==2.8.5",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.scripts]
orrix-seed = "orrix.demo_seed:main"

[tool.setuptools]
packages = ["orrix", "orrix.web"]

[tool.setuptools.package-data]
# lab_presets.json carries the Attack Lab's preset messages into the install.
# It is generated from attacks/corpus.yaml by scripts/build_lab_presets.py;
# the harness itself is deliberately not a package, so without this file the
# deployed lab has no presets. Nothing from attacks/recorded/ is shipped.
"orrix.web" = [
    "templates/*.html",
    "templates/partials/*.html",
    "static/*",
    "lab_presets.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
