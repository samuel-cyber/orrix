[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orrix"
version = "0.0.1"
description = "Sandbox-only PayPal dispute response agent."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Ojo Samuel Oluwasemilore" }]
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "requests",
    "python-dotenv",
    "jinja2",
    "python-multipart",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.scripts]
orrix-seed = "orrix.demo_seed:main"

[tool.setuptools]
packages = ["orrix", "orrix.web"]

[tool.setuptools.package-data]
"orrix.web" = ["templates/*.html", "templates/partials/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
