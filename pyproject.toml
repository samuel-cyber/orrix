[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orrix"
version = "0.0.1"
description = "Sandbox-only PayPal dispute response agent."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Ojo Samuel Oluwasemilore" }]
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "requests",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["orrix", "orrix.web"]

[tool.pytest.ini_options]
testpaths = ["tests"]
